[package]
name = "discord-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A lightweight native Discord client"

[dependencies]
bytes = "1.12.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "wayland", "x11", "clipboard", "links"] }
egui = { version = "0.37", default-features = false, features = ["monochrome_emoji_fonts"] }
flate2 = "1.1.10"
futures-util = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "multipart", "gzip"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
tokio = { version = "1.54.1", features = ["rt", "net", "time", "sync", "macros"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 2
